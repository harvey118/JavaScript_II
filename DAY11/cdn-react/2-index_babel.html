<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <title>Hello World</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- Don't use this in production: -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body>
    <div id="root"></div>

    <script>
        function MyApp() {
            const name = "React";
            const [clicked, setClicked] = React.useState(false);

            if (clicked) {
                return React.createElement(
                    React.Fragment,
                    null,
                    React.createElement(
                        "button",
                        { onClick: () => setClicked(false) },
                        "Click me"
                    ),
                    React.createElement("h1", null, "Clicked!")
                );
            }

            return React.createElement(
                React.Fragment,
                null,
                React.createElement(
                    "button",
                    { onClick: () => setClicked(true) },
                    "Click me"
                ),
                React.createElement("h1", null, `Hello, ${name}!`),
                React.createElement("h1", null, "Hello, world3!"),
                React.createElement("h1", null, "Hello, world4!"),
                React.createElement("h1", null, "Hello, world5!")
            );
        }

        // const root = ReactDOM.createRoot(document.getElementById("root"));
        ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(MyApp));

    </script>
