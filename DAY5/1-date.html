<body>
    <script>
        const dateObj = new Date(); //建立一個日期物件，預設為目前的日期與時間
        const dataStr = Date(); //透過函式呼叫，回傳字串

        const now = new Date(); //建立一個日期物件，預設為目前的日期與時間
        console.log(now); //顯示目前的日期與時間

        const someDate = new Date("2023-12-25 10:30:00"); //建立一個特定日期的日期物件
        console.log(`冰島(UTC+0)過聖誕節時，台灣時間物件是: ${someDate}`); //顯示特定的日期與時間

        console.clear();


        const todayLastTime = new Date(2025, 10, 16, 23, 59, 59, 999); //建立一個特定日期的日期物件
        const diffALLMs = todayLastTime.getTime() - now.getTime(); //取得兩個日期物件的時間差，單位為毫秒
        console.log(diffALLMs);
        //今天還剩下 48677316 毫秒=> 算出 小時 分鐘 秒 毫秒

        // const diffHrs = Math.floor(diffALLMs / (1000 * 60 * 60));
        // const diffMins = Math.floor((diffALLMs % (1000 * 60 * 60)) / (1000 * 60));
        // const diffSecs = Math.floor((diffALLMs % (1000 * 60)) / 1000);
        // const diffMilliseconds = diffALLMs % 1000;
        //console.log(`今天剩下，還有 ${diffHrs} 小時 ${diffMins} 分 ${diffSecs} 秒 ${diffMilliseconds} 毫秒`);

        const diffHrs2 = Math.floor(diffALLMs / (1000 * 60 * 60));   // 1小時 = 1000毫秒 * 60秒 * 60分(3600000毫秒)
        const diffMins2 = Math.floor((diffALLMs % (1000 * 60 * 60)) / (1000 * 60));  // 1分鐘 = 1000毫秒 * 60秒(60000毫秒)
        const diffSecs2 = Math.floor((diffALLMs % (1000 * 60 * 60) % (1000 * 60)) / 1000);  // 1秒鐘 = 1000毫秒
        const diffMilliseconds2 = diffALLMs % (1000 * 60 * 60) % (1000 * 60) % 1000;  // 毫秒 = 1毫秒
        console.log(`今天剩下，還有 ${diffHrs2} 小時 ${diffMins2} 分 ${diffSecs2} 秒 ${diffMilliseconds2} 毫秒`);

        console.clear();


        function getCountDownToNewYear() {
            const now = new Date();
            const nextYear = new Date(now.getFullYear() + 1, 0); // 2026年1月1日 00:00:00.000
            const diffALLMs = nextYear.getTime() - now.getTime(); //取得兩個日期物件的時間差，單位為毫秒

            const Day = Math.floor(diffALLMs / (1000 * 60 * 60 * 24));
            const Hr = Math.floor(diffALLMs / (1000 * 60 * 60)) % 24;
            const Min = Math.floor(diffALLMs / (1000 * 60)) % 60;
            const Sec = Math.floor(diffALLMs / 1000) % 60;

            console.log(`距離今年跨年，還有 ${Day}天 ${Hr}小時 ${Min}分 ${Sec}秒`);
        }
        getCountDownToNewYear();

    </script>
